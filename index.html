<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somewhere in Time</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f1e9;
            color: #51483e;
            font-family: Georgia, "Noto Serif SC", serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            text-align: center;
            padding: 70px 25px;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            color: #a18e79;
        }

        h1 {
            margin: 38px 0 18px;
            font-size: clamp(42px, 8vw, 72px);
            font-weight: normal;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 16px;
            letter-spacing: 4px;
            color: #95816d;
        }

        .divider {
            width: 45px;
            height: 1px;
            background: #b9a58e;
            margin: 55px auto;
        }

        .message {
            font-size: 16px;
            line-height: 2.4;
            color: #75695d;
            letter-spacing: 1px;
        }

        .signature {
            margin-top: 55px;
            font-size: 13px;
            color: #a18e79;
            letter-spacing: 2px;
        }

        footer {
            margin-top: 100px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: #b3a696;
        }
    </style>
</head>

<body>
    <main>
        <div class="container">

            <div class="eyebrow">
                A WARM DIGITAL MEMORY ARCHIVE
            </div>

            <h1>Somewhere in Time</h1>

            <div class="subtitle">
                一些被时间收藏的瞬间
            </div>

            <div class="divider"></div>

            <div class="message">
                有些瞬间不会因为时间过去而消失。<br>
                它们只是换了一种方式，被收藏起来。<br><br>
                这是我第一次亲手创建这样一个地方。<br>
                希望你在这里，能找到一些温柔的回忆。
            </div>

            <div class="signature">
                送给你，愿你天天开心，幸福。
            </div>

            <footer>
                MEMORIES · PHOTOGRAPHS · STORIES
            </footer>

        </div>
    </main>
</body>
</html>
