<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memories · Somewhere in Time</title>
<style>
:root{--bg:#f5f1e9;--ink:#51483e;--muted:#95816d;--line:#b9a58e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Noto Serif SC",serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:24px max(22px,calc((100vw - 1100px)/2));border-bottom:1px solid #e9e0d5}
.brand{text-decoration:none;font-size:18px}.top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid #c9b8a5;background:transparent;color:#675443;border-radius:25px;padding:9px 15px;font-size:12px;letter-spacing:1px}
.btn:hover{background:#eae0d4}.btn.primary{background:#75614c;color:white;border-color:#75614c}.btn.danger{color:#a05045}
.hero{text-align:center;padding:75px 20px 48px}.eyebrow{font:11px Arial,sans-serif;letter-spacing:5px;color:#a18e79}
h1{font-size:clamp(38px,7vw,68px);font-weight:normal;margin:24px 0 12px}.subtitle{color:var(--muted);letter-spacing:4px;font-size:14px}
.intro{font-size:13px;color:#a18e79;margin:28px auto 0;line-height:2}
main{max-width:1120px;margin:auto;padding:0 22px}.stage{padding:32px 0 20px;min-height:240px}
.stage-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.stage-heading .hint{font:11px Arial,sans-serif;letter-spacing:3px;color:#b3a696}.stage-heading .tools{display:flex;gap:8px}
.collections{display:flex;flex-direction:column;gap:34px}.collection{padding:5px 0 14px}.collection-head{text-align:center;margin-bottom:20px}
.collection h2{font-weight:normal;font-size:23px;margin:4px 0 8px}.collection-note{font-size:13px;color:#968371;white-space:pre-wrap;line-height:1.9;margin:0}
.collection-actions{margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;align-items:start;padding:10px 6px 20px}
.polaroid{min-width:0;background:#fffdfa;padding:9px 9px 25px;box-shadow:0 8px 22px #5c483220;transform:rotate(var(--rot));transition:transform .2s,box-shadow .2s;position:relative}
.polaroid:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 12px 28px #5c483235}.photo-open{display:block;border:0;padding:0;background:none;width:100%}
.photo-open img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.photo-caption{text-align:center;color:#8c7967;font-size:12px;margin-top:10px;min-height:1em;overflow-wrap:anywhere}
.photo-tools{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}.photo-tools button{border:0;background:#f0e8df;color:#6b5643;padding:5px 8px;border-radius:12px;font-size:11px}
.empty{text-align:center;color:#a18e79;font-size:13px;border:1px dashed #d5c5b3;padding:32px 12px;margin:12px auto;max-width:500px}
.film{height:48px;position:relative;margin:40px -12px;transform:rotate(-4deg);opacity:.58;overflow:hidden}
.film:before{content:"";position:absolute;inset:6px 0;background:repeating-linear-gradient(90deg,transparent 0 50px,#d7c4ae66 50px 53px),linear-gradient(#876b53,#876b53);background-size:auto,auto;box-shadow:inset 0 0 0 2px #6d513b;border-top:2px dashed #e8d7c5;border-bottom:2px dashed #e8d7c5}
.film:after{content:"";position:absolute;inset:16px 0;border-top:1px solid #e3cfb7;border-bottom:1px solid #e3cfb7;opacity:.6}
.more{text-align:center;margin:12px 0 25px}.bottom{text-align:center;padding:75px 20px 120px;color:#a18e79;font-style:italic;letter-spacing:2px}
.edit-only{display:none!important}body.editing .edit-only{display:inline-flex!important}body.editing .edit-only.block{display:flex!important}
.player{position:fixed;right:18px;bottom:18px;z-index:30;background:#f9f4eb;border:1px solid #d8c8b6;box-shadow:0 6px 30px #59463128;border-radius:18px;padding:12px;max-width:calc(100vw - 36px)}
.player-bar{display:flex;align-items:center;gap:8px}.player .btn{padding:8px 10px}.player-title{font-size:12px;color:#806b57;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-details{margin-top:10px;display:none}.player.open .player-details{display:block}.player-details input{width:100%;accent-color:#876b53}
.dialog-back{position:fixed;inset:0;z-index:50;background:#33291f9c;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{width:min(540px,100%);max-height:90vh;overflow:auto;background:#faf6ef;border-radius:16px;padding:24px;box-shadow:0 16px 60px #0004}
.dialog h3{font-size:22px;font-weight:normal;margin:0 0 18px}.field{display:block;margin:14px 0;color:#806b57;font-size:13px}.field input,.field textarea,.field select{display:block;margin-top:7px;width:100%;border:1px solid #d2c1ae;background:#fffdf9;border-radius:8px;padding:10px;color:#51483e}.field textarea{min-height:75px;resize:vertical}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.lightbox{position:fixed;inset:0;background:#221d19e8;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 12px;gap:12px}
.lightbox img{max-width:min(95vw,950px);max-height:75vh;object-fit:contain;background:white;padding:8px}.lightbox p{color:#eee0cf;text-align:center;white-space:pre-wrap;max-width:700px;margin:0}.lightbox-controls{display:flex;gap:10px}.lightbox .btn{color:#fff;border-color:#9d8a78}
.notice{font-size:12px;color:#9b7760;line-height:1.8;text-align:center;margin:12px 0 0}.hidden{display:none!important}
@media(max-width:720px){.top{padding:18px}.brand{font-size:15px}.hero{padding:55px 15px 30px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.polaroid{padding:7px 7px 19px}.stage{padding:20px 0}.film{margin:25px -8px;height:35px}.collection h2{font-size:19px}.player{right:9px;bottom:9px}.player-title{max-width:95px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">Somewhere in Time</a><div class="top-actions"><button class="btn" id="editToggle">进入编辑</button><button class="btn edit-only" id="exportBtn">导出相册</button><button class="btn edit-only" id="importBtn">导入相册</button></div></header>
<section class="hero"><div class="eyebrow">A WARM DIGITAL MEMORY ARCHIVE</div><h1>Memories</h1><div class="subtitle">一些被时间收藏的瞬间</div><p class="intro">那些值得留住的日子，都在这里。</p></section>
<main id="stages"></main>
<footer class="bottom">To be continued…<p style="font:10px Arial,sans-serif;letter-spacing:3px;margin-top:30px">MEMORIES · PHOTOGRAPHS · STORIES</p></footer>
<div class="player" id="player"><div class="player-bar"><button class="btn" id="playerExpand" title="展开播放器">♫</button><button class="btn" id="prevSong" title="上一首">❮</button><button class="btn" id="playSong" title="播放/暂停">▶</button><button class="btn" id="nextSong" title="下一首">❯</button><span class="player-title" id="songName">回忆歌单</span></div><div class="player-details"><label class="field">音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5"></label><p class="notice">把有权使用的 MP3 放入 music 文件夹，并在代码中填写歌单。</p></div></div>
<audio id="audio" preload="none"></audio><input id="importFile" type="file" accept=".json,application/json" class="hidden">
<div id="modalRoot"></div><div id="lightboxRoot"></div>
<script>
'use strict';
// ① 歌曲配置：把 music/ 文件夹中的文件名写在这里。
const SONGS = [
  // {title:'第一首歌',src:'music/song1.mp3'},
  // {title:'第二首歌',src:'music/song2.mp3'},
];
const STORAGE_KEY='somewhere-in-time-album-v1';
const STAGE_COUNT=3;
const makeId=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const blank=()=>({version:1,stages:[[],[],[]]});
let data=blank(), editing=false, songIndex=0, currentLightbox=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(obj){return obj&&obj.version===1&&Array.isArray(obj.stages)&&obj.stages.length===3&&obj.stages.every(s=>Array.isArray(s)&&s.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.photos)&&c.photos.every(p=>p&&typeof p.id==='string'&&typeof p.src==='string')))}
let hasLocalAlbum=false;try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){const parsed=JSON.parse(saved);if(validate(parsed)){data=parsed;hasLocalAlbum=true}}}catch(e){console.warn('读取本地相册失败',e)}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));return true}catch(e){alert('浏览器存储空间可能已满！请先「导出相册」备份。新增图片较多时，建议使用较小的照片。');return false}}
function change(fn){const previous=structuredClone(data);fn();if(!persist()){data=previous;return}render()}
function getCollection(stage,id){return data.stages[stage]?.find(c=>c.id===id)}
function photoById(stage,cid,pid){return getCollection(stage,cid)?.photos.find(p=>p.id===pid)}
function render(){const root=$('#stages');root.innerHTML=data.stages.map((collections,s)=>`<section class="stage"><div class="stage-heading"><span class="hint">${String(s+1).padStart(2,'0')} / 03</span><div class="tools"><button class="btn edit-only" data-action="new" data-stage="${s}">＋ 新建小集合</button></div></div><div class="collections">${collections.length?collections.map(c=>renderCollection(c,s)).join(''):`<div class="empty">${editing?'这里还没有照片，点击「新建小集合」开始。':'回忆正在慢慢收集…'}</div>`}</div></section>${s<2?'<div class="film" aria-hidden="true"></div>':''}`).join('');}
function renderCollection(c,s){const visible=c.expanded?c.photos:c.photos.slice(0,6);return `<article class="collection"><div class="collection-head"><h2>${esc(c.name)}</h2>${c.note?`<p class="collection-note">${esc(c.note)}</p>`:''}<div class="collection-actions edit-only block"><button class="btn" data-action="editCollection" data-stage="${s}" data-id="${esc(c.id)}">编辑集合</button><button class="btn" data-action="addPhoto" data-stage="${s}" data-id="${esc(c.id)}">＋ 添加照片</button><button class="btn danger" data-action="deleteCollection" data-stage="${s}" data-id="${esc(c.id)}">删除集合</button></div></div>${c.photos.length?`<div class="photo-grid">${visible.map((p,i)=>`<div class="polaroid" style="--rot:${[-3,2,-2,3,1,-1][i%6]}deg"><button class="photo-open" data-action="openPhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}"><img src="${esc(p.src)}" alt="${esc(p.title||'回忆照片')}" loading="lazy"></button>${p.title?`<div class="photo-caption">${esc(p.title)}</div>`:''}<div class="photo-tools edit-only block"><button data-action="editPhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}">编辑</button><button data-action="movePhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}">移动</button><button data-action="deletePhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}">删除</button></div></div>`).join('')}</div>`:`<div class="empty">这个集合还没有照片</div>`}${c.photos.length>6?`<div class="more"><button class="btn" data-action="toggleMore" data-stage="${s}" data-id="${esc(c.id)}">${c.expanded?'收起照片':'查看更多回忆 · '+(c.photos.length-6)+' 张'}</button></div>`:''}</article>`}
function modal(title,html,onSave){const root=$('#modalRoot');root.innerHTML=`<div class="dialog-back"><div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><form id="editForm">${html}<div class="dialog-actions"><button type="button" class="btn" id="cancelModal">取消</button><button type="submit" class="btn primary">保存</button></div></form></div></div>`;$('#cancelModal').onclick=closeModal;$('#editForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.currentTarget))};}
function closeModal(){$('#modalRoot').innerHTML=''}
function editCollection(s,id){const old=id?getCollection(s,id):null;modal(old?'编辑小集合':'新建小集合',`<label class="field">集合名称<input name="name" required maxlength="60" value="${esc(old?.name||'')}"></label><label class="field">备注（可以留空）<textarea name="note" maxlength="1000">${esc(old?.note||'')}</textarea></label>`,f=>{const name=String(f.get('name')).trim();if(!name)return;change(()=>{if(old){old.name=name;old.note=String(f.get('note'))}else data.stages[s].push({id:makeId(),name,note:String(f.get('note')),photos:[]})});closeModal()})}
function editPhoto(s,cid,pid){const p=photoById(s,cid,pid);if(!p)return;modal('编辑照片',`<label class="field">照片名称（可选）<input name="title" maxlength="80" value="${esc(p.title||'')}"></label><label class="field">备注（可选）<textarea name="note" maxlength="1000">${esc(p.note||'')}</textarea></label>`,f=>{change(()=>{p.title=String(f.get('title'));p.note=String(f.get('note'))});closeModal()})}
function movePhoto(s,cid,pid){const c=getCollection(s,cid),p=photoById(s,cid,pid);if(!p)return;const options=data.stages.flatMap((cols,si)=>cols.map(col=>({si,id:col.id,name:col.name})));modal('移动照片',`<label class="field">目标集合<select name="target">${options.map(o=>`<option value="${o.si}|${esc(o.id)}" ${o.si===s&&o.id===cid?'selected':''}>${o.si+1} · ${esc(o.name)}</option>`).join('')}</select></label><label class="field">在集合中的位置<select name="position"><option value="end">放到最后</option><option value="start">放到最前</option></select></label>`,f=>{const [si,id]=String(f.get('target')).split('|'),target=getCollection(Number(si),id);if(!target)return;change(()=>{c.photos=c.photos.filter(x=>x.id!==pid);if(f.get('position')==='start')target.photos.unshift(p);else target.photos.push(p)});closeModal()})}
function addPhotos(s,cid){modal('添加照片',`<label class="field">选择照片（可以一次选择多张）<input name="files" type="file" accept="image/*" multiple required></label><p class="notice">图片会压缩后保存在浏览器中。请定期导出备份；浏览器容量有限，不适合一次上传大量原图。</p>`,async f=>{const files=Array.from($('#editForm [name="files"]').files||[]);if(!files.length)return;const button=$('#editForm button[type="submit"]');button.disabled=true;button.textContent='正在处理照片…';try{const photos=[];for(const file of files){if(!file.type.startsWith('image/'))continue;const src=await compressImage(file);photos.push({id:makeId(),src,title:'',note:''})}if(!photos.length)throw Error('没有可用的图片');change(()=>getCollection(s,cid).photos.push(...photos));closeModal()}catch(e){alert('添加失败：'+e.message)}finally{button.disabled=false;button.textContent='保存'}})}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('无法读取图片'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('图片格式无法读取'));img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.76))};img.src=reader.result};reader.readAsDataURL(file)})}
function openPhoto(s,cid,pid){const c=getCollection(s,cid);const index=c.photos.findIndex(p=>p.id===pid);if(index<0)return;currentLightbox={s,cid,index};drawLightbox()}
function drawLightbox(){if(!currentLightbox)return;const {s,cid,index}=currentLightbox,c=getCollection(s,cid),p=c?.photos[index];if(!p){closeLightbox();return}$('#lightboxRoot').innerHTML=`<div class="lightbox" role="dialog" aria-modal="true"><img src="${esc(p.src)}" alt="${esc(p.title||'回忆照片')}"><p>${esc([p.title,p.note].filter(Boolean).join('\n'))}</p><div class="lightbox-controls"><button class="btn" id="lightPrev">❮ 上一张</button><button class="btn" id="lightClose">关闭</button><button class="btn" id="lightNext">下一张 ❯</button></div></div>`;$('#lightClose').onclick=closeLightbox;$('#lightPrev').onclick=()=>{currentLightbox.index=(index-1+c.photos.length)%c.photos.length;drawLightbox()};$('#lightNext').onclick=()=>{currentLightbox.index=(index+1)%c.photos.length;drawLightbox()}}
function closeLightbox(){currentLightbox=null;$('#lightboxRoot').innerHTML=''}
$('#stages').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,s=Number(b.dataset.stage),id=b.dataset.id,pid=b.dataset.photo,c=getCollection(s,id);if(a==='new')editCollection(s);if(a==='editCollection')editCollection(s,id);if(a==='addPhoto')addPhotos(s,id);if(a==='editPhoto')editPhoto(s,id,pid);if(a==='movePhoto')movePhoto(s,id,pid);if(a==='openPhoto')openPhoto(s,id,pid);if(a==='toggleMore'){c.expanded=!c.expanded;render()}if(a==='deletePhoto'&&confirm('确定删除这张照片吗？请确保已经导出备份。'))change(()=>{c.photos=c.photos.filter(p=>p.id!==pid)});if(a==='deleteCollection'&&confirm('确定删除整个集合及其中的照片吗？请确保已经导出备份。'))change(()=>{data.stages[s]=data.stages[s].filter(x=>x.id!==id)})});
$('#editToggle').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('#editToggle').textContent=editing?'完成编辑':'进入编辑';render()};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='somewhere-in-time-album-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!validate(incoming))throw Error('文件格式不正确');if(!confirm('导入会覆盖这个浏览器当前的相册，建议先导出备份。确定继续吗？'))return;const old=data;data=incoming;if(!persist()){data=old;return}render();alert('导入成功！注意：这只更新当前浏览器，尚未发布到所有人的网站。')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeLightbox()}if(currentLightbox&&e.key==='ArrowLeft')$('#lightPrev')?.click();if(currentLightbox&&e.key==='ArrowRight')$('#lightNext')?.click()});
const audio=$('#audio');audio.volume=.5;function showSong(){if(!SONGS.length){$('#songName').textContent='暂无歌曲';return}$('#songName').textContent=SONGS[songIndex].title;audio.src=SONGS[songIndex].src}
function play(){if(!SONGS.length){alert('还没有添加音乐。请把 MP3 文件放入 music 文件夹，并修改代码顶部的 SONGS 歌单。');return}if(audio.paused){audio.play().catch(()=>alert('音乐无法播放，请检查 MP3 路径。'))}else audio.pause()}
function skip(n){if(!SONGS.length)return;songIndex=(songIndex+n+SONGS.length)%SONGS.length;showSong();audio.play().catch(()=>{})}
$('#playSong').onclick=play;$('#prevSong').onclick=()=>skip(-1);$('#nextSong').onclick=()=>skip(1);$('#playerExpand').onclick=()=>$('#player').classList.toggle('open');$('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.onplay=()=>$('#playSong').textContent='❚❚';audio.onpause=()=>$('#playSong').textContent='▶';audio.onended=()=>skip(1);showSong();render();if(!hasLocalAlbum){fetch('album.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(published=>{if(validate(published)){data=published;render()}}).catch(()=>{})}
</script>
</body>
</html>
