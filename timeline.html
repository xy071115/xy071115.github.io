.hanging-rope{animation:ropeBreeze 11s ease-in-out infinite alternate;transform-origin:50% 0}

<footer class="bottom">To be continued…<p style="font:10px Arial,sans-serif;letter-spacing:3px;margin-top:30px">MEMORIES · PHOTOGRAPHS · STORIES</p></footer>
<div class="player" id="player"><div class="player-bar"><button class="btn" id="playerExpand" title="展开播放器">♫</button><button class="btn" id="prevSong" title="上一首">❮</button><button class="btn" id="playSong" title="播放/暂停">▶</button><button class="btn" id="nextSong" title="下一首">❯</button><span class="player-title" id="songName">回忆歌单</span></div><div class="player-details"><label class="field">音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5"></label><div class="playlist-heading">回忆歌单 <span id="songCount"></span></div><div class="playlist-list" id="playlistList"></div></div></div>
<audio id="audio" preload="none"></audio><input id="importFile" type="file" accept=".json,application/json" class="hidden">
<div id="modalRoot"></div><div id="lightboxRoot"></div>
<script>
'use strict';
// ① 歌曲配置：把 music/ 文件夹中的文件名写在这里。
const SONGS = [
  {"title": "Bad Girl", "src": "music/badgirl.mp3"},
  {"title": "遇见", "src": "music/yujian.mp3.mp3"},
  {"title": "半壶纱 · 刘珂矣", "src": "music/刘珂矣-半壶纱.mp3"},
  {"title": "无颜女 · 小凌、徐良", "src": "music/小凌、徐良 - 无颜女.mp3"},
  {"title": "当你 · 林俊杰", "src": "music/当你-林俊杰.mp3"},
  {"title": "北京巷弄 · 徐良", "src": "music/徐良 - 北京巷弄.mp3"},
  {"title": "天真 · 徐良", "src": "music/徐良 - 天真.mp3"},
  {"title": "电话里的秘密 · 徐良", "src": "music/徐良 - 电话里的秘密.mp3"},
  {"title": "那时雨 · 徐良", "src": "music/徐良 - 那时雨.mp3"},
  {"title": "和平分手 · 徐良、Britneylee小暖", "src": "music/徐良、Britneylee小暖 - 和平分手.mp3"},
  {"title": "七秒钟的记忆 · 徐良、孙羽幽", "src": "music/徐良、孙羽幽 - 七秒钟的记忆.mp3"},
  {"title": "客官不可以 · 徐良、小凌", "src": "music/徐良、小凌 - 客官不可以.mp3"},
  {"title": "红装 · 徐良、阿悄", "src": "music/徐良、阿悄 - 红装.mp3"},
  {"title": "犯贱 · 徐良、阿悄", "src": "music/犯贱-徐良_阿悄.mp3"}
];
const STORAGE_KEY='somewhere-in-time-album-v1';
const STAGE_COUNT=3;
const makeId=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const blank=()=>({version:1,stages:[[],[],[]]});
let data=blank(), editing=false, songIndex=0, currentLightbox=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(obj){return obj&&obj.version===1&&Array.isArray(obj.stages)&&obj.stages.length===3&&obj.stages.every(s=>Array.isArray(s)&&s.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.photos)&&c.photos.every(p=>p&&typeof p.id==='string'&&typeof p.src==='string')))}
// IndexedDB 用于保存较大的相册；旧 localStorage 保留，不会主动清除。
const DB_NAME='somewhere-in-time-album-db',DB_STORE='albums';
let albumDB=null,hasLocalAlbum=false,saveChain=Promise.resolve(),saveFailureShown=false;
function openAlbumDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(Error('浏览器不支持 IndexedDB'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbRead(){return new Promise((resolve,reject)=>{const tx=albumDB.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).get('main');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbWrite(snapshot){return new Promise((resolve,reject)=>{const tx=albumDB.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(snapshot,'main');tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||Error('写入失败'));tx.onabort=()=>reject(tx.error||Error('写入中止'))})}
function warnSave(error){console.error('相册保存失败',error);if(!saveFailureShown){saveFailureShown=true;alert('照片未能保存到浏览器。请先导出相册备份，并检查浏览器可用空间。不要清除网站数据。')}}
function persist(){const snapshot=structuredClone(data);const task=saveChain.catch(()=>{}).then(async()=>{if(albumDB){await dbWrite(snapshot)}else{localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot))}return true});saveChain=task;task.catch(warnSave);return task}
function change(fn){const previous=structuredClone(data);fn();render();return persist().catch(err=>{data=previous;render();return false})}
async function initializeAlbum(){let old=null;try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(validate(parsed))old=parsed}}catch(e){console.warn('读取旧相册失败',e)}
 try{albumDB=await openAlbumDB();const stored=await dbRead();if(validate(stored)){data=stored;hasLocalAlbum=true}else if(old){data=old;hasLocalAlbum=true;await dbWrite(structuredClone(old))}}catch(e){console.warn('IndexedDB 不可用，尝试旧存储',e);albumDB=null;if(old){data=old;hasLocalAlbum=true}}
 if(!hasLocalAlbum){try{const r=await fetch('album.json',{cache:'no-store'});const published=r.ok?await r.json():null;if(validate(published))data=published}catch(e){console.warn('读取公开相册失败',e)}}render()}

function getCollection(stage,id){return data.stages[stage]?.find(c=>c.id===id)}
function photoById(stage,cid,pid){return getCollection(stage,cid)?.photos.find(p=>p.id===pid)}
const STAGE_LABELS=['第一部分','第二部分','第三部分'];
let activeStage=null;
function coverPhoto(s){for(const c of data.stages[s])if(c.photos.length)return c.photos[0].src;return ''}
// 装饰用内联 SVG，不依赖外部图片，也不会遮挡照片。
const ORNAMENTS={
 flower:`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M31 37Q34 51 27 63" fill="none" stroke="#9b9875" stroke-width="1.5"/><path d="M31 49Q19 40 13 47Q22 56 30 53" fill="#b9b69b" opacity=".8"/><g fill="#f2e3c8" stroke="#c7ad87" stroke-width=".8"><ellipse cx="31" cy="19" rx="7" ry="13"/><ellipse cx="31" cy="19" rx="7" ry="13" transform="rotate(72 31 31)"/><ellipse cx="31" cy="19" rx="7" ry="13" transform="rotate(144 31 31)"/><ellipse cx="31" cy="19" rx="7" ry="13" transform="rotate(216 31 31)"/><ellipse cx="31" cy="19" rx="7" ry="13" transform="rotate(288 31 31)"/></g><circle cx="31" cy="31" r="6" fill="#cda86c"/></svg>`,
 planet:`<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="33" rx="29" ry="10" transform="rotate(-24 32 33)" fill="none" stroke="#b89973" stroke-width="1.7"/><circle cx="32" cy="33" r="14" fill="#ddc8a9" stroke="#b89973" stroke-width="1"/><path d="M5 45Q31 29 59 20" fill="none" stroke="#b89973" stroke-width="1.4"/></svg>`,
 spark:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2Q17 14 30 16Q17 18 16 30Q15 18 2 16Q15 14 16 2Z" fill="#c6a575"/></svg>`
};
function ornament(kind,extra=''){return `<span class="memory-ornament ${kind}-art ${extra}" aria-hidden="true">${ORNAMENTS[kind]}</span>`}
function render(){
 document.body.classList.toggle("on-cover",activeStage===null);
 const root=$('#stages');
 document.querySelector('.hero').classList.toggle('hidden',activeStage!==null);
 document.querySelector('#backToCovers').classList.toggle('hidden',activeStage===null);
 if(activeStage===null){
  root.innerHTML=`<div class="real-cover"><div class="cover-eyebrow">A LITTLE PLACE FOR MEMORIES</div><h1 class="cover-title">Somewhere in Time</h1><p class="cover-subtitle">把日子轻轻挂在时光里</p><div class="cover-wrap"><svg class="hanging-rope" viewBox="0 0 1000 170" preserveAspectRatio="none" aria-hidden="true"><path d="M18 18 Q500 245 982 18" fill="none" stroke="#ad845d" stroke-width="4" stroke-linecap="round"/></svg><div class="cover-row">${STAGE_LABELS.map((label,i)=>`<button class="hanging-card" data-action="enterStage" data-stage="${i}" style="--tilt:${[-7,2,6][i]}deg;--delay:${[-2,-5,-8][i]}s"><span class="peg"></span><span class="cover-image cover-photo-${i}" ${coverPhoto(i)?`style="background-image:url('${esc(coverPhoto(i)).replace(/'/g,'&#39;')}')"`:''}>${coverPhoto(i)?'':`<span class="cover-placeholder">${['☼','♡','✿'][i]}</span>`}</span><span class="cover-caption">Part ${['I','II','III'][i]}</span></button>`).join('')}</div>${ornament('flower','first')}${ornament('flower','second')}${ornament('planet')}${ornament('spark')}</div><p class="cover-hint">选择一张照片，走进一段回忆</p><button class="btn cover-enter" data-action="enterStage" data-stage="0">Enter Memories →</button></div>`;
  return;
 }
 const s=activeStage,collections=data.stages[s];
 root.innerHTML=`<section class="gallery-stage">${ornament("flower","first")}${ornament("flower","second")}${ornament("planet")}${ornament("spark")}<div class="stage-heading"><span class="hint">${String(s+1).padStart(2,'0')} / 03</span><div class="tools"><button class="btn edit-only" data-action="new" data-stage="${s}">＋ 新建小集合</button></div></div><div class="gallery-intro"><h2>${STAGE_LABELS[s]}</h2><div class="mini-divider"></div></div><div class="collections">${collections.length?collections.map(c=>renderCollection(c,s)).join(''):`<div class="empty">${editing?'点击「新建小集合」，然后上传照片。':'这里还没有照片，回忆正在慢慢收集…'}</div>`}</div></section>`;
}
function renderCollection(c,s){
 const visible=c.expanded?c.photos:c.photos.slice(0,18);
 const photos=visible.map((p,i)=>`<div class="framed-photo" data-photo-id="${esc(p.id)}" data-collection-id="${esc(c.id)}" data-stage-id="${s}" style="--n:${i%12};--angle:${[-1,1,0,2,-2,1][i%6]}deg;--dx:${Number(p.x)||0}px;--dy:${Number(p.y)||0}px;${Number(p.width)>0?`--photo-width:${Math.round(p.width)}px;`:``}"><button class="photo-open" data-action="openPhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}"><img src="${esc(p.src)}" alt="${esc(p.title||'回忆照片')}" loading="lazy"></button>${p.title?`<div class="photo-caption">${esc(p.title)}</div>`:''}<span class="resize-grip edit-only" title="拖动调整照片大小" aria-label="调整相框大小"></span><div class="photo-tools edit-only block"><button data-action="editPhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}">编辑</button><button data-action="movePhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}">换集合</button><button data-action="deletePhoto" data-stage="${s}" data-id="${esc(c.id)}" data-photo="${esc(p.id)}">删除</button></div></div>`).join('');
 return `<article class="collection">${ornament("flower")}${ornament("spark")}<div class="collection-head"><h2>${esc(c.name)}</h2>${c.note?`<p class="collection-note">${esc(c.note)}</p>`:''}<div class="collection-actions edit-only block"><button class="btn" data-action="editCollection" data-stage="${s}" data-id="${esc(c.id)}">编辑集合</button><button class="btn" data-action="addPhoto" data-stage="${s}" data-id="${esc(c.id)}">＋ 添加照片</button><button class="btn danger" data-action="deleteCollection" data-stage="${s}" data-id="${esc(c.id)}">删除集合</button></div></div>${c.photos.length?`<p class="drag-hint">按住照片中间移动位置 · 拖动相框右下角调整大小 · 自动保存</p><div class="gallery-layout ${s===1?'heart-layout':'wall-layout'}">${photos}</div>`:`<div class="empty">这个集合还没有照片</div>`}${c.photos.length>18?`<div class="more"><button class="btn" data-action="toggleMore" data-stage="${s}" data-id="${esc(c.id)}">${c.expanded?'收起照片':'查看更多回忆 · '+(c.photos.length-18)+' 张'}</button></div>`:''}</article>`;
}
function modal(title,html,onSave){const root=$('#modalRoot');root.innerHTML=`<div class="dialog-back"><div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><form id="editForm">${html}<div class="dialog-actions"><button type="button" class="btn" id="cancelModal">取消</button><button type="submit" class="btn primary">保存</button></div></form></div></div>`;$('#cancelModal').onclick=closeModal;$('#editForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.currentTarget))};}
function closeModal(){$('#modalRoot').innerHTML=''}
function editCollection(s,id){const old=id?getCollection(s,id):null;modal(old?'编辑小集合':'新建小集合',`<label class="field">集合名称<input name="name" required maxlength="60" value="${esc(old?.name||'')}"></label><label class="field">备注（可以留空）<textarea name="note" maxlength="1000">${esc(old?.note||'')}</textarea></label>`,f=>{const name=String(f.get('name')).trim();if(!name)return;change(()=>{if(old){old.name=name;old.note=String(f.get('note'))}else data.stages[s].push({id:makeId(),name,note:String(f.get('note')),photos:[]})});closeModal()})}
function editPhoto(s,cid,pid){const p=photoById(s,cid,pid);if(!p)return;modal('编辑照片',`<label class="field">照片名称（可选）<input name="title" maxlength="80" value="${esc(p.title||'')}"></label><label class="field">备注（可选）<textarea name="note" maxlength="1000">${esc(p.note||'')}</textarea></label>`,f=>{change(()=>{p.title=String(f.get('title'));p.note=String(f.get('note'))});closeModal()})}
function movePhoto(s,cid,pid){const c=getCollection(s,cid),p=photoById(s,cid,pid);if(!p)return;const options=data.stages.flatMap((cols,si)=>cols.map(col=>({si,id:col.id,name:col.name})));modal('移动照片',`<label class="field">目标集合<select name="target">${options.map(o=>`<option value="${o.si}|${esc(o.id)}" ${o.si===s&&o.id===cid?'selected':''}>${o.si+1} · ${esc(o.name)}</option>`).join('')}</select></label><label class="field">在集合中的位置<select name="position"><option value="end">放到最后</option><option value="start">放到最前</option></select></label>`,f=>{const [si,id]=String(f.get('target')).split('|'),target=getCollection(Number(si),id);if(!target)return;change(()=>{c.photos=c.photos.filter(x=>x.id!==pid);if(f.get('position')==='start')target.photos.unshift(p);else target.photos.push(p)});closeModal()})}
function addPhotos(s,cid){modal('添加照片',`<label class="field">选择照片（可以一次选择多张）<input name="files" type="file" accept="image/*" multiple required></label><p class="notice">自动压缩照片并逐张保存。大量照片需要一点时间，请勿关闭页面。</p>`,async()=>{const files=Array.from($('#editForm [name="files"]').files||[]).filter(f=>f.type.startsWith('image/'));if(!files.length)return;const button=$('#editForm button[type="submit"]');button.disabled=true;let added=0;try{for(let i=0;i<files.length;i++){button.textContent=`正在保存 ${i+1}/${files.length}…`;const src=await compressImage(files[i]);const result=await change(()=>getCollection(s,cid).photos.push({id:makeId(),src,title:'',note:''}));if(result===false)break;added++}closeModal();alert(`已成功保存 ${added} 张照片${added<files.length?'，其余照片未保存，请检查浏览器空间。':''}`)}catch(e){closeModal();alert(`已保存 ${added} 张，后续照片处理失败：${e.message}`)}finally{button.disabled=false;button.textContent='保存'}})}
function compressImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('图片格式无法读取'))};img.onload=()=>{try{const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.7))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.src=url})}
function openPhoto(s,cid,pid){const c=getCollection(s,cid);const index=c.photos.findIndex(p=>p.id===pid);if(index<0)return;currentLightbox={s,cid,index};drawLightbox()}
function drawLightbox(){if(!currentLightbox)return;const {s,cid,index}=currentLightbox,c=getCollection(s,cid),p=c?.photos[index];if(!p){closeLightbox();return}$('#lightboxRoot').innerHTML=`<div class="lightbox" role="dialog" aria-modal="true"><img src="${esc(p.src)}" alt="${esc(p.title||'回忆照片')}"><p>${esc([p.title,p.note].filter(Boolean).join('\n'))}</p><div class="lightbox-controls"><button class="btn" id="lightPrev">❮ 上一张</button><button class="btn" id="lightClose">关闭</button><button class="btn" id="lightNext">下一张 ❯</button></div></div>`;$('#lightClose').onclick=closeLightbox;$('#lightPrev').onclick=()=>{currentLightbox.index=(index-1+c.photos.length)%c.photos.length;drawLightbox()};$('#lightNext').onclick=()=>{currentLightbox.index=(index+1)%c.photos.length;drawLightbox()}}
function closeLightbox(){currentLightbox=null;$('#lightboxRoot').innerHTML=''}
$('#stages').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,s=Number(b.dataset.stage),id=b.dataset.id,pid=b.dataset.photo,c=getCollection(s,id);if(a==='enterStage'){activeStage=s;render();window.scrollTo(0,0);return}if(a==='new')editCollection(s);if(a==='editCollection')editCollection(s,id);if(a==='addPhoto')addPhotos(s,id);if(a==='editPhoto')editPhoto(s,id,pid);if(a==='movePhoto')movePhoto(s,id,pid);if(a==='openPhoto')openPhoto(s,id,pid);if(a==='toggleMore'){c.expanded=!c.expanded;render()}if(a==='deletePhoto'&&confirm('确定删除这张照片吗？请确保已经导出备份。'))change(()=>{c.photos=c.photos.filter(p=>p.id!==pid)});if(a==='deleteCollection'&&confirm('确定删除整个集合及其中的照片吗？请确保已经导出备份。'))change(()=>{data.stages[s]=data.stages[s].filter(x=>x.id!==id)})});
// 在编辑模式拖动照片：位置作为像素偏移保存到原相册 JSON。
// 浏览模式仍可正常点击放大；心形相册仅允许在初始位置附近微调。
let dragState=null, suppressPhotoClick=false;
$('#stages').addEventListener('pointerdown',e=>{
 if(!editing || e.button!==0)return;
 const grip=e.target.closest('.framed-photo .resize-grip');
 const opener=e.target.closest('.framed-photo .photo-open');
 if(!opener&&!grip)return;
 const card=(grip||opener).closest('.framed-photo'), wall=card.closest('.gallery-layout');
 if(!wall)return;
 const stage=Number(card.dataset.stageId),collection=card.dataset.collectionId,photo=photoById(stage,collection,card.dataset.photoId);
 if(!photo)return;
 const x=Number(photo.x)||0,y=Number(photo.y)||0;
 dragState={card,wall,opener:opener||grip,photo,startX:e.clientX,startY:e.clientY,x,y,moved:false,stage,resizing:!!grip,initialWidth:card.getBoundingClientRect().width,oldWidth:photo.width};
 (opener||grip).setPointerCapture(e.pointerId);
 e.preventDefault();
});
$('#stages').addEventListener('pointermove',e=>{
 const d=dragState;if(!d)return;
 const deltaX=e.clientX-d.startX,deltaY=e.clientY-d.startY;
 if(Math.hypot(deltaX,deltaY)>4)d.moved=true;
 if(!d.moved)return;
 if(d.resizing){const maxWidth=d.stage===1?Math.min(180,d.wall.clientWidth*.24):Math.min(420,d.wall.clientWidth*.75);const width=Math.round(Math.max(65,Math.min(maxWidth,d.initialWidth+deltaX)));d.photo.width=width;d.card.style.setProperty('--photo-width',width+'px');d.card.classList.add('dragging');return}
 const limit=d.stage===1?40:Math.max(80,Math.min(220,d.wall.clientWidth*.22));
 let x=Math.max(-limit,Math.min(limit,d.x+deltaX));
 let y=Math.max(-limit,Math.min(limit,d.y+deltaY));
 // 把偏移限制在照片墙的边界内。
 const wr=d.wall.getBoundingClientRect(),cr=d.card.getBoundingClientRect();
 x=Math.max(x, x+wr.left-cr.left+6);x=Math.min(x,x+wr.right-cr.right-6);
 y=Math.max(y, y+wr.top-cr.top+6);y=Math.min(y,y+wr.bottom-cr.bottom-6);
 d.photo.x=Math.round(x);d.photo.y=Math.round(y);
 d.card.style.setProperty('--dx',d.photo.x+'px');d.card.style.setProperty('--dy',d.photo.y+'px');
 d.card.classList.add('dragging');
});
function finishDrag(){
 const d=dragState;if(!d)return;
 d.card.classList.remove('dragging');
 if(d.moved){suppressPhotoClick=true;setTimeout(()=>suppressPhotoClick=false,100);persist().catch(()=>{d.photo.x=d.x;d.photo.y=d.y;d.photo.width=d.oldWidth;d.card.style.setProperty('--dx',d.x+'px');d.card.style.setProperty('--dy',d.y+'px');if(d.oldWidth)d.card.style.setProperty('--photo-width',d.oldWidth+'px');else d.card.style.removeProperty('--photo-width')})}dragState=null;
}
$('#stages').addEventListener('pointerup',finishDrag);
$('#stages').addEventListener('pointercancel',finishDrag);
$('#stages').addEventListener('click',e=>{if(suppressPhotoClick&&e.target.closest('.photo-open')){e.stopImmediatePropagation();e.preventDefault();suppressPhotoClick=false}},true);
$('#backToCovers').onclick=()=>{activeStage=null;render();window.scrollTo(0,0)};
$('#editToggle').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('#editToggle').textContent=editing?'完成编辑':'进入编辑';render()};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='somewhere-in-time-album-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!validate(incoming))throw Error('文件格式不正确');if(!confirm('导入会覆盖这个浏览器当前的相册，建议先导出备份。确定继续吗？'))return;const old=data;data=incoming;try{await persist()}catch(err){data=old;render();throw err}render();alert('导入成功！注意：这只更新当前浏览器，尚未发布到所有人的网站。')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeLightbox()}if(currentLightbox&&e.key==='ArrowLeft')$('#lightPrev')?.click();if(currentLightbox&&e.key==='ArrowRight')$('#lightNext')?.click()});
const audio=$('#audio');audio.volume=.5;function showSong(){renderPlaylist();if(!SONGS.length){$('#songName').textContent='暂无歌曲';return}$('#songName').textContent=SONGS[songIndex].title;audio.src=SONGS[songIndex].src}
function play(){if(!SONGS.length){alert('还没有添加音乐。请把 MP3 文件放入 music 文件夹，并修改代码顶部的 SONGS 歌单。');return}if(audio.paused){audio.play().catch(()=>alert('音乐无法播放，请检查 MP3 路径。'))}else audio.pause()}
function skip(n){if(!SONGS.length)return;songIndex=(songIndex+n+SONGS.length)%SONGS.length;showSong();audio.play().catch(()=>{})}
$('#playSong').onclick=play;$('#prevSong').onclick=()=>skip(-1);$('#nextSong').onclick=()=>skip(1);$('#playerExpand').onclick=()=>$('#player').classList.toggle('open');$('#volume').oninput=e=>audio.volume=Number(e.target.value);
function renderPlaylist(){const el=$('#playlistList');if(!el)return;$('#songCount').textContent=SONGS.length+' 首';el.innerHTML=SONGS.map((song,i)=>`<button class="playlist-song ${i===songIndex?'current':''}" data-song-index="${i}"><span>${i===songIndex?'♫':'♪'}</span><span>${esc(song.title)}</span></button>`).join('')}
$('#playlistList').addEventListener('click',e=>{const b=e.target.closest('[data-song-index]');if(!b)return;songIndex=Number(b.dataset.songIndex);showSong();audio.play().catch(()=>alert('无法播放，请检查音乐文件路径和授权。'))});audio.onplay=()=>$('#playSong').textContent='❚❚';audio.onpause=()=>$('#playSong').textContent='▶';audio.onended=()=>skip(1);showSong();initializeAlbum();
</script>
</body>
</html>
